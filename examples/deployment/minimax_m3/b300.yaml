served-model-name: nvidia/MiniMax-M3-NVFP4
gpu-memory-utilization: 0.92
block-size: 128
language-model-only: true
enable-prefix-caching: true
enable-chunked-prefill: true
no-enable-flashinfer-autotune: true
reasoning-parser: minimax_m3
tool-call-parser: minimax_m3
enable-auto-tool-choice: true
default-chat-template-kwargs:
  thinking_mode: enabled
attention-config:
  backend: FLASHINFER
  use_trtllm_attention: true
  indexer_kv_dtype: fp8
kv-cache-dtype: fp8
max-num-batched-tokens: 16384
stream-interval: 20
trust-remote-code: true
speculative-config:
  method: eagle3
  model: Inferact/MiniMax-M3-EAGLE3-GQA
  num_speculative_tokens: 3
  attention_backend: FLASHINFER
  use_local_argmax_reduction: true
tensor-parallel-size: 2
max-num-seqs: 36
compilation-config:
  cudagraph_mode: FULL_AND_PIECEWISE
  cudagraph_capture_sizes:
  - 8
  - 12
  - 16
  - 20
  - 24
  - 28
  - 32
  - 36
  - 40
  - 44
  - 48
  - 52
  - 56
  - 60
  - 64
  - 68
  - 72
  - 76
  - 80
  - 84
  - 88
  - 92
  - 96
  - 100
  - 104
  - 108
  - 112
  - 116
  - 120
  - 124
  - 128
  - 132
  - 136
  - 140
  - 144
  - 256
  - 512
  - 1024
  - 2048
kv-transfer-config:
  kv_connector: SimpleCPUOffloadConnector
  kv_role: kv_both
  kv_connector_extra_config:
    cpu_bytes_to_use: 804232626176
    lazy_offload: true
    host_gated_stores: true
renderer-tokenize-cache-mb: 256
quantization-config:
  targets:
    re:.*\.layers\.[0-9]+\.block_sparse_moe\.shared_experts\.(gate_up_proj|gate_proj|up_proj|down_proj)$: nvfp4_w4a16
moe-backend: flashinfer_trtllm
