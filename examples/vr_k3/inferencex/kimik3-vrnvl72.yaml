kimik3-fp4-vrnvl72-dynamo-vllm-agentic-dspark-mooncake-p8d16-disagg:
  image: vllm-k3-vr-branch
  model: moonshotai/Kimi-K3
  model-prefix: kimik3
  runner: cluster:vrnvl72-local
  precision: fp4
  framework: dynamo-vllm
  router:
    name: dynamo-router
    version: 1.5.0
  kv-p2p-transfer: nixl
  multinode: true
  disagg: true
  srt-recipe-dir: kimik3/vllm/vrnvl72-fp4/agentx
  scenarios:
    agentic-coding:
    - search-space:
      - spec-decoding: mtp
        kv-offloading: none
        conc-list: [1, 8]
        srt-recipe: disagg-p8-d16-variants.yaml:override_1p1d_dl7_nixl
        eval-srt-recipe: disagg-p8-d16-variants.yaml:override_1p1d_dl7_nixl_eval
        prefill: {num-worker: 1, tp: 8, dcp-size: 8, ep: 8, dp-attn: false}
        decode: {num-worker: 1, tp: 16, dcp-size: 16, ep: 1, dp-attn: false}
    - dram-utilization: 0.42
      search-space:
      - spec-decoding: mtp
        kv-offloading: dram
        kv-offload-backend: {name: mooncake, version: 0.3.13.post1}
        conc-list: [64]
        srt-recipe: disagg-p8-d16-variants.yaml:override_1p1d_dl7_mc
        eval-srt-recipe: disagg-p8-d16-variants.yaml:override_1p1d_dl7_mc_eval
        prefill: {num-worker: 1, tp: 8, dcp-size: 8, ep: 8, dp-attn: false}
        decode: {num-worker: 1, tp: 16, dcp-size: 16, ep: 1, dp-attn: false}
      - spec-decoding: mtp
        kv-offloading: dram
        kv-offload-backend: {name: mooncake, version: 0.3.13.post1}
        conc-list: [48]
        srt-recipe: disagg-p8-d16-variants.yaml:override_2p1d_dl3_cap64_mc
        eval-srt-recipe: disagg-p8-d16-variants.yaml:override_2p1d_dl3_cap64_mc_eval
        prefill: {num-worker: 2, tp: 8, dcp-size: 8, ep: 8, dp-attn: false}
        decode: {num-worker: 1, tp: 16, dcp-size: 16, ep: 1, dp-attn: false}
    - dram-utilization: 0.52
      search-space:
      - spec-decoding: mtp
        kv-offloading: dram
        kv-offload-backend: {name: mooncake, version: 0.3.13.post1}
        conc-list: [160, 256]
        srt-recipe: disagg-p8-d16-variants.yaml:override_2p1d_dl3_cap128_mc
        eval-srt-recipe: disagg-p8-d16-variants.yaml:override_2p1d_dl3_cap128_mc_eval
        prefill: {num-worker: 2, tp: 8, dcp-size: 8, ep: 8, dp-attn: false}
        decode: {num-worker: 1, tp: 16, dcp-size: 16, ep: 1, dp-attn: false}
